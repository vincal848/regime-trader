[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "regime-trader"
version = "0.1.0"
description = "Hourly SPY regime trader: Gaussian HMM state detection, per-state playbooks, deterministic risk"
readme = "README.md"
license = "MIT"
authors = [{ name = "Caleb Vinson" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "hmmlearn>=0.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]
llm = ["anthropic>=0.40"]
dashboard = ["streamlit>=1.35"]
demo = ["yfinance>=0.2.40"]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scipy-stubs>=1.11",
]

[project.scripts]
regime-trader = "regime_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
filterwarnings = [
    # hmmlearn 0.3.x sets ndarray.shape, deprecated in NumPy 2.5; harmless
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:hmmlearn",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY"]
ignore = ["N803", "N806"]  # A, K, T follow the HMM literature's notation

[tool.ruff.lint.isort]
known-first-party = ["regime_trader"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hmmlearn.*", "ib_async.*", "yfinance.*", "streamlit.*", "anthropic.*"]
ignore_missing_imports = true
